# ios-runtime-poc.yml — build the reconstructed Phase 02 Runtime PoC for iOS.
#
# PHASE_02_RECONSTRUCTED_POC. This workflow produces an UNSIGNED IPA for later
# signing/sideloading. It never signs, never uses an Apple ID, certificate or
# provisioning profile, and never claims that JIT or Box64 works on an iPhone.
#
# Manual run: Actions -> "iOS Runtime PoC (unsigned IPA)" -> Run workflow.
#
# Corrections after the first real Apple CI run (both blockers are documented in
# ios/Documentation/RELATORIO_FASE_02_RECONSTRUIDA.md §10):
#   A) project.pbxproj was invalid (unquoted `sourceTree = <group>;`), fixed in the
#      generator (tools/generate_xcodeproj.py) — not by hand-editing the project.
#   B) `tee ../Documentation/evidence/...` ran inside a `cd build/host` subshell, so
#      the evidence directory did not exist at that relative path. Every evidence
#      path is now derived from $GITHUB_WORKSPACE and created with mkdir -p first.
#
# Mandatory order (do not reorder): checkout -> Apple environment -> generate ->
# structural validation -> xcodebuild -list (hard gate) -> iphoneos build -> locate
# .app -> validate bundle -> Payload -> unsigned IPA -> inspect IPA -> SHA-256 ->
# upload artifact.
name: iOS Runtime PoC (unsigned IPA)

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  EVIDENCE_DIR: ${{ github.workspace }}/ios/Documentation/evidence

jobs:
  # Job 1 — run the same suites on the macOS runner. This exercises the Darwin backend
  # (MAP_JIT, pthread_jit_write_protect_np, sys_icache_invalidate) for real, under the
  # macOS security model. These results are MACOS_RUNNER_ARM64 evidence and are NOT
  # IPHONE_PHYSICAL evidence.
  darwin-host-harness:
    name: Darwin backend on the macOS runner (MACOS_RUNNER_ARM64)
    runs-on: macos-14
    steps:
      - name: 1. Checkout
        uses: actions/checkout@v4

      - name: 2. Apple environment
        run: |
          set -eu
          mkdir -p "$EVIDENCE_DIR"
          {
            echo "EVIDENCE_CLASS=MACOS_RUNNER_ARM64"
            echo "NOTE=runner macOS, NOT iPhone; these results never prove iOS behaviour"
            echo "--- sw_vers";              sw_vers
            echo "--- uname -m";             uname -m
            echo "--- xcodebuild -version";  xcodebuild -version
            echo "--- xcode-select -p";      xcode-select -p
            echo "--- iphonesimulator sdk";  xcrun --sdk iphonesimulator --show-sdk-version 2>/dev/null || true
            echo "--- iphoneos sdk";        xcrun --sdk iphoneos --show-sdk-version 2>/dev/null || true
            echo "--- clang --version";      clang --version
            echo "--- swift --version";      swift --version
            echo "--- cmake --version";      cmake --version
          } | tee "$EVIDENCE_DIR/ci_macos_arm64_environment.txt"

      - name: 3. Build the C harness with CMake
        working-directory: ${{ github.workspace }}/ios
        run: |
          set -eu
          set -o pipefail
          mkdir -p "$EVIDENCE_DIR"
          echo "EVIDENCE_DIR=$EVIDENCE_DIR"
          cmake -S . -B build/host -DCMAKE_BUILD_TYPE=Debug 2>&1 \
            | tee "$EVIDENCE_DIR/ci_macos_arm64_configure.log"
          cmake --build build/host -j3 2>&1 | tee "$EVIDENCE_DIR/ci_macos_arm64_build.log"
          echo "warnings=$(grep -c 'warning:' "$EVIDENCE_DIR/ci_macos_arm64_build.log" || true)" \
            | tee "$EVIDENCE_DIR/ci_macos_arm64_warning_count.txt"
          echo "errors=$(grep -c 'error:' "$EVIDENCE_DIR/ci_macos_arm64_build.log" || true)" \
            | tee -a "$EVIDENCE_DIR/ci_macos_arm64_warning_count.txt"

      - name: 4. Run the unit tests and the full suite
        working-directory: ${{ github.workspace }}/ios
        run: |
          set -eu
          set -o pipefail
          mkdir -p "$EVIDENCE_DIR"
          test -x build/host/phase02_unit_tests
          test -x build/host/phase02_poc
          (cd build/host && ./phase02_unit_tests) 2>&1 \
            | tee "$EVIDENCE_DIR/ci_macos_arm64_unit_tests.log"
          (cd build/host && ./phase02_poc --suite all \
              --export "$EVIDENCE_DIR/ci_macos_arm64_phase02_report.txt") 2>&1 \
            | tee "$EVIDENCE_DIR/ci_macos_arm64_suite_stdout.log"
          tail -1 "$EVIDENCE_DIR/ci_macos_arm64_suite_stdout.log"

      - name: 5. Report the Darwin-only results
        working-directory: ${{ github.workspace }}/ios
        run: |
          set -eu
          {
            echo "=== MACOS_RUNNER_ARM64 evidence (NOT IPHONE_PHYSICAL) ==="
            grep -E "TEST=(jit|memory|ipc)\." "$EVIDENCE_DIR/ci_macos_arm64_phase02_report.txt" || true
            echo "=== summary ==="
            tail -1 "$EVIDENCE_DIR/ci_macos_arm64_phase02_report.txt"
          } | tee "$EVIDENCE_DIR/ci_macos_arm64_darwin_results.txt"

      - name: 6. Upload the macOS-runner evidence
        uses: actions/upload-artifact@v4
        with:
          name: Winlator-RuntimePoC-macos-runner-arm64-evidence
          path: ${{ env.EVIDENCE_DIR }}/ci_macos_arm64_*
          if-no-files-found: error

  # Job 2 — the deliverable: an unsigned IPA built for iphoneos.
  unsigned-ipa:
    name: Build WinlatorPhase02 for iphoneos and package an unsigned IPA
    runs-on: macos-14
    steps:
      - name: 1. Checkout
        uses: actions/checkout@v4

      - name: 2. Apple environment
        run: |
          set -eu
          mkdir -p "$EVIDENCE_DIR"
          {
            echo "EVIDENCE_CLASS=MACOS_RUNNER_ARM64 (build host) / artifact = UNSIGNED_IPA"
            echo "--- sw_vers";             sw_vers
            echo "--- uname -m";            uname -m
            echo "--- xcodebuild -version"; xcodebuild -version
            echo "--- xcode-select -p";     xcode-select -p
            echo "--- iphoneos sdk";        xcrun --sdk iphoneos --show-sdk-version
            echo "--- clang --version";     clang --version
            echo "--- swift --version";     swift --version
          } | tee "$EVIDENCE_DIR/ci_ipa_environment.txt"

      # ---- 3. generate / regenerate the Xcode project
      - name: 3. Regenerate the Xcode project
        working-directory: ${{ github.workspace }}/ios
        run: |
          set -eu
          set -o pipefail
          mkdir -p "$EVIDENCE_DIR"
          python3 tools/generate_xcodeproj.py 2>&1 | tee "$EVIDENCE_DIR/ci_ipa_generate.log"
          git --no-pager diff --stat -- WinlatorPhase02.xcodeproj | tee "$EVIDENCE_DIR/ci_ipa_generate_diff.txt"

      # ---- 4. structural preflight (fast, but NOT the authoritative parser)
      - name: 4. Structural validation (preflight)
        working-directory: ${{ github.workspace }}/ios
        run: |
          set -eu
          set -o pipefail
          python3 tools/validate_xcodeproj.py 2>&1 | tee "$EVIDENCE_DIR/ci_ipa_validate.log"

      # ---- 5. authoritative gate: the real Xcode parser must accept the project
      - name: 5. GATE — xcodebuild must be able to read the project
        working-directory: ${{ github.workspace }}/ios
        run: |
          set -eu
          set -o pipefail
          if ! xcodebuild -project WinlatorPhase02.xcodeproj -list \
                 > "$EVIDENCE_DIR/ci_ipa_xcodebuild_list.log" 2>&1; then
              echo "xcodebuild FAILED to read the project — the iphoneos build will NOT start."
              cat "$EVIDENCE_DIR/ci_ipa_xcodebuild_list.log"
              exit 1
          fi
          cat "$EVIDENCE_DIR/ci_ipa_xcodebuild_list.log"
          grep -q "WinlatorPhase02" "$EVIDENCE_DIR/ci_ipa_xcodebuild_list.log" \
            || { echo "FAIL: target 'WinlatorPhase02' missing from -list output"; exit 1; }
          grep -A2 "Schemes:" "$EVIDENCE_DIR/ci_ipa_xcodebuild_list.log" | grep -q "WinlatorPhase02" \
            || { echo "FAIL: shared scheme 'WinlatorPhase02' not visible to xcodebuild"; exit 1; }
          echo "GATE_PASS=xcodebuild -list read the project and its scheme"

      # ---- 6. iphoneos build (only reached when the gate passed)
      - name: 6. Build for iphoneos (unsigned, deterministic DerivedData)
        working-directory: ${{ github.workspace }}/ios
        run: |
          set -eu
          set -o pipefail
          xcodebuild \
            -project WinlatorPhase02.xcodeproj \
            -scheme WinlatorPhase02 \
            -configuration Debug \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "${{ github.workspace }}/ios/build/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee "$EVIDENCE_DIR/ci_ipa_xcodebuild.log"

      # ---- 7. locate the .app and 8. validate the bundle
      - name: 7-8. Locate and validate the .app bundle
        working-directory: ${{ github.workspace }}/ios
        run: |
          set -eu
          APP=$(find build/DerivedData/Build/Products -maxdepth 2 -name "*.app" -type d | head -1)
          if [ -z "$APP" ]; then echo "FAIL: no .app produced"; exit 1; fi
          echo "$APP" > "$EVIDENCE_DIR/ci_ipa_app_path.txt"
          test -f "$APP/Info.plist" || { echo "FAIL: Info.plist missing"; exit 1; }
          EXEC=$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$APP/Info.plist")
          test -f "$APP/$EXEC"      || { echo "FAIL: executable missing"; exit 1; }
          case "$(file "$APP/$EXEC")" in
            *arm64*) : ;;
            *) echo "FAIL: unexpected architecture"; exit 1 ;;
          esac
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Info.plist")
          if [ "$BUNDLE_ID" != "io.winlator.phase02.reconstructed" ]; then
              echo "FAIL: unexpected bundle identifier '$BUNDLE_ID'"
              exit 1
          fi
          {
            echo "app=$APP"
            echo "executable=$EXEC"
            echo "bundle_identifier=$BUNDLE_ID"
            echo "minimum_os_version=$(/usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$APP/Info.plist" 2>/dev/null || echo '(absent)')"
            echo "device_family=$(/usr/libexec/PlistBuddy -c 'Print :UIDeviceFamily' "$APP/Info.plist" 2>/dev/null || echo '(absent)')"
            echo "file=$(file "$APP/$EXEC")"
            echo "lipo=$(lipo -info "$APP/$EXEC" 2>&1 || true)"
            echo "bridge_symbols=$(nm "$APP/$EXEC" 2>/dev/null | grep -c Phase02Bridge || true)"
            echo "size_kb=$(du -sk "$APP" | cut -f1)"
            echo "--- requested entitlements (NOT granted: unsigned build) ---"
            plutil -p RuntimePoC/WinlatorPhase02.entitlements || true
            echo "--- entitlements carried by the binary (expected: none) ---"
            codesign -d --entitlements :- "$APP" 2>&1 || echo "(not signed)"
          } | tee "$EVIDENCE_DIR/ci_ipa_app_check.txt"

      # ---- 9. Payload/ and 10. unsigned IPA
      - name: 9-10. Package the unsigned IPA (Payload/<real name>.app)
        working-directory: ${{ github.workspace }}/ios
        run: |
          set -eu
          APP=$(find build/DerivedData/Build/Products -maxdepth 2 -name "*.app" -type d | head -1)
          APP_NAME=$(basename "$APP")
          rm -rf build/ipa && mkdir -p build/ipa/Payload
          cp -R "$APP" "build/ipa/Payload/$APP_NAME"
          (cd build/ipa && zip -qry Winlator-iOS-RuntimePoC-unsigned.ipa Payload)
          cp build/ipa/Winlator-iOS-RuntimePoC-unsigned.ipa .
          {
            echo "IPA_NAME=$APP_NAME"
            echo "IPA_PATH=$(pwd)/Winlator-iOS-RuntimePoC-unsigned.ipa"
            echo "SIGNING=none (UNSIGNED_IPA)"
          } | tee "$EVIDENCE_DIR/ci_ipa_packaging.txt"
          ls -l Winlator-iOS-RuntimePoC-unsigned.ipa | tee -a "$EVIDENCE_DIR/ci_ipa_packaging.txt"

      # ---- 11. inspect the IPA and 12. SHA-256
      - name: 11-12. Inspect the IPA and record its SHA-256
        working-directory: ${{ github.workspace }}/ios
        run: |
          set -eu
          set -o pipefail
          IPA=Winlator-iOS-RuntimePoC-unsigned.ipa
          unzip -l "$IPA" | tee "$EVIDENCE_DIR/ci_ipa_unzip_list.txt"
          unzip -l "$IPA" | grep -q "Payload/.*\.app/"          || { echo "FAIL: no Payload/*.app"; exit 1; }
          unzip -l "$IPA" | grep -q "Payload/.*\.app/Info.plist" || { echo "FAIL: no Info.plist in Payload"; exit 1; }
          shasum -a 256 "$IPA" | tee "$EVIDENCE_DIR/ci_ipa_sha256.txt"
          echo "size_bytes=$(stat -f%z "$IPA")" | tee -a "$EVIDENCE_DIR/ci_ipa_sha256.txt"

      # ---- 13. upload the artifact
      - name: 13. Upload the artifact (IPA + logs + manifest)
        uses: actions/upload-artifact@v4
        with:
          name: Winlator-iOS-RuntimePoC
          path: |
            ios/Winlator-iOS-RuntimePoC-unsigned.ipa
            ios/Documentation/evidence/ci_ipa_*
          if-no-files-found: error
